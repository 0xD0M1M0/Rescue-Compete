services:
  # Optional local OIDC: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.keycloak.yml up -d
  project:
    build: .
    expose:
      - "80"
    env_file:
      - .env
    environment:
      MYSQL_SERVER: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      OIDC_ENABLED: ${OIDC_ENABLED:-0}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_LOGIN_LABEL: ${OIDC_LOGIN_LABEL:-}
    volumes:
      - ./public:/var/www/html/
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dbvolume:/var/lib/mysql
      - ./sql-scheme/webappdb-V6-1.sql:/docker-entrypoint-initdb.d/webappdb-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbvolume: {}
